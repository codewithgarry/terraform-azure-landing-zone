name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["live/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["live/**", "modules/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write       # OIDC token for Azure login, no client secret stored
  contents: read
  pull-requests: write  # post the plan as a PR comment

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running apply

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}

jobs:
  validate:
    name: fmt · validate · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: live
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform test (mocked providers)
        run: |
          (cd modules/storage-account && terraform init -backend=false && terraform test)
          cd live
          for env in dev prod; do terraform test -var-file=env/$env.tfvars; done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

  plan:
    name: plan (${{ matrix.environment }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config=env/${{ matrix.environment }}.backend.hcl

      - name: terraform plan
        id: plan
        run: |
          terraform plan -var-file=env/${{ matrix.environment }}.tfvars -out=tfplan -lock-timeout=5m
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            live/tfplan
            live/plan.txt
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/plan.txt', 'utf8');
            const max = 60000;
            const body = [
              `### Terraform plan: \`${process.env.ENVIRONMENT}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan.length > max ? plan.slice(0, max) + '\n... (truncated)' : plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply-dev:
    name: apply (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: live
      - run: terraform init -backend-config=env/dev.backend.hcl
      - run: terraform apply -lock-timeout=5m tfplan

  apply-prod:
    name: apply (prod)
    needs: apply-dev
    runs-on: ubuntu-latest
    # The "production" environment has required reviewers, so this job waits for manual approval.
    environment: production
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: live
      - run: terraform init -backend-config=env/prod.backend.hcl
      - run: terraform apply -lock-timeout=5m tfplan
